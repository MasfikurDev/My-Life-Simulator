name: Temporary merged-branch cleanup runner

on:
  push:
    branches:
      - ci/merged-branch-cleanup-dry-run
      - ci/merged-branch-cleanup-live

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: temporary-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor == 'MasfikurDev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.ref_name == 'ci/merged-branch-cleanup-dry-run' }}
      MINIMUM_AGE_DAYS: "7"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Run safe merged-branch cleanup
        run: bash .github/scripts/cleanup-merged-branches.sh
