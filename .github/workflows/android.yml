name: Android wrapper APK
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-wrapper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      beta_version: ${{ steps.beta-version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Prepare persistent beta signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "::error::Persistent Android signing secrets are required before publishing a beta APK."
              exit 1
            fi
            echo "Persistent signing secrets are unavailable; this non-release validation build will use the standard debug key."
            exit 0
          fi

          signing_dir="$RUNNER_TEMP/my-life-simulator-signing"
          mkdir -p "$signing_dir"
          keystore_path="$signing_dir/my-life-simulator.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          keytool -list -keystore "$keystore_path" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
      - name: Determine APK version
        id: beta-version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            latest_version=0
            tag_refs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/beta-" --jq '.[].ref')"
            while IFS= read -r tag_ref; do
              tag="${tag_ref#refs/tags/}"
              if [[ "$tag" =~ ^beta-([0-9]+)-[0-9]+$ ]]; then
                candidate="${BASH_REMATCH[1]}"
                if (( candidate > latest_version )); then
                  latest_version="$candidate"
                fi
              fi
            done <<< "$tag_refs"

            version_code=$((latest_version + 1))
            version_name="0.1.$version_code"
            echo "Preparing beta release $version_code (latest published beta: $latest_version)."
            echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          else
            # Validation/manual APKs are not releases and must not consume release
            # numbers or be installable as upgrades over a published beta.
            version_code=1
            version_name="0.1.0-$GITHUB_EVENT_NAME"
            echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon --build-cache --parallel --console=plain -PappVersionCode="${{ steps.beta-version.outputs.version_code }}" -PappVersionName="${{ steps.beta-version.outputs.version_name }}" assembleDebug
      - name: Verify persistent APK signature
        shell: bash
        run: |
          if [[ -z "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "::error::Refusing to publish an APK without the persistent signing key."
              exit 1
            fi
            echo "No persistent key on this non-release run; skipping certificate verification."
            exit 0
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: my-life-simulator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  publish-beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: my-life-simulator-debug-apk
          path: release
      - name: Publish beta pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ needs.build.outputs.beta_version }}-${{ github.run_attempt }}
          name: My Life Simulator Beta ${{ needs.build.outputs.beta_version }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/app-debug.apk
