name: Android wrapper APK
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-wrapper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      beta_version: ${{ steps.beta-version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Prepare beta signing key
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'pull_request' && 'ci-test-password' || (github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_PASSWORD || '') }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'pull_request' && 'ci-test' || (github.ref == 'refs/heads/main' && secrets.ANDROID_KEY_ALIAS || '') }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && 'ci-test-password' || (github.ref == 'refs/heads/main' && secrets.ANDROID_KEY_PASSWORD || '') }}
        run: |
          signing_dir="$RUNNER_TEMP/my-life-simulator-signing"
          mkdir -p "$signing_dir"
          keystore_path="$signing_dir/my-life-simulator.jks"

          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "::error::Persistent Android signing secrets are required before publishing a beta APK."
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              # PRs have no access to repository signing secrets. Generate a throwaway
              # key so CI still tests beta signing and APK-to-keystore fingerprint checks.
              ANDROID_KEYSTORE_PASSWORD="ci-test-password"
              ANDROID_KEY_ALIAS="ci-test"
              ANDROID_KEY_PASSWORD="ci-test-password"
              keytool -genkeypair -noprompt -keystore "$keystore_path" \
                -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
                -alias "$ANDROID_KEY_ALIAS" -dname "CN=CI Test,O=My Life Simulator" \
                -keyalg RSA -keysize 2048 -validity 2
            else
              echo "No beta signing key for this non-release manual run; local debug signing will be used."
              exit 0
            fi
          else
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          fi

          test -s "$keystore_path"
          keytool -list -keystore "$keystore_path" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          chmod 600 "$keystore_path"
          certificate_sha256="$(keytool -list -v -keystore "$keystore_path" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/{gsub(/:/, "", $2); print tolower($2); exit}')"
          if [[ ! "$certificate_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not extract a valid SHA-256 certificate fingerprint from the beta keystore."
            exit 1
          fi
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"
          echo "certificate_sha256=$certificate_sha256" >> "$GITHUB_OUTPUT"
      - name: Determine APK version
        id: beta-version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            latest_version=0
            release_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.prerelease == true and .draft == false) | .tag_name')"
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^beta-([0-9]+)-[0-9]+$ ]]; then
                candidate="${BASH_REMATCH[1]}"
                if (( candidate > latest_version )); then
                  latest_version="$candidate"
                fi
              fi
            done <<< "$release_tags"

            version_code=$((latest_version + 1))
            version_name="0.1.$version_code"
            echo "Preparing beta release $version_code (latest published beta: $latest_version)."
            echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          else
            # Validation/manual APKs are not releases and must not consume release
            # numbers or be installable as upgrades over a published beta.
            version_code=1
            version_name="0.1.0-$GITHUB_EVENT_NAME"
            echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
      - name: Assemble Android variants
        working-directory: android
        env:
          # Gradle receives signing secrets only for this build step.
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'pull_request' && 'ci-test-password' || (github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_PASSWORD || '') }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'pull_request' && 'ci-test' || (github.ref == 'refs/heads/main' && secrets.ANDROID_KEY_ALIAS || '') }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && 'ci-test-password' || (github.ref == 'refs/heads/main' && secrets.ANDROID_KEY_PASSWORD || '') }}
        run: |
          gradle_args=(--no-daemon --build-cache --parallel --console=plain
            -PappVersionCode="${{ steps.beta-version.outputs.version_code }}"
            -PappVersionName="${{ steps.beta-version.outputs.version_name }}")
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            gradle "${gradle_args[@]}" assembleBeta
          else
            # Compile both the developer build and the release-like beta variant.
            gradle "${gradle_args[@]}" assembleDebug assembleBeta
          fi
      - name: Verify beta APK signature
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "::error::Refusing to publish a beta APK without the persistent signing key."
              exit 1
            fi
            echo "No beta signing key on this non-release run; skipping certificate verification."
            exit 0
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          apk="android/app/build/outputs/apk/beta/app-beta.apk"
          signer_output="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\\n' "$signer_output"
          expected="${{ steps.signing.outputs.certificate_sha256 }}"
          actual="$(printf '%s\\n' "$signer_output" | awk '/certificate SHA-256 digest:/ {sub(/^.*certificate SHA-256 digest: /, ""); gsub(/:/, ""); print tolower($0); exit}')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Beta signing certificate fingerprint is missing or invalid."
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Beta APK signer does not match the configured keystore certificate."
            echo "Expected: $expected"
            echo "Actual:   $actual"
            exit 1
          fi
          echo "Verified beta APK signer matches the configured keystore: $actual"
      - name: Name beta APK clearly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: cp android/app/build/outputs/apk/beta/app-beta.apk "My-Life-Simulator-Beta-${{ steps.beta-version.outputs.version_code }}.apk"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: my-life-simulator-beta-apk
          path: My-Life-Simulator-Beta-${{ steps.beta-version.outputs.version_code }}.apk
          if-no-files-found: error
          retention-days: 1

  publish-beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: my-life-simulator-beta-apk
          path: release
      - name: Publish beta pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ needs.build.outputs.beta_version }}-${{ github.run_attempt }}
          name: My Life Simulator Beta ${{ needs.build.outputs.beta_version }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/My-Life-Simulator-Beta-${{ needs.build.outputs.beta_version }}.apk
