name: Android wrapper APK
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-wrapper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # setup-gradle persists Gradle distributions, dependency artifacts, and build-cache data.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon --build-cache --parallel --console=plain assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: my-life-simulator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish beta pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}-${{ github.run_attempt }}
          name: My Life Simulator Beta ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
