name: Generate npm lockfile
on:
  push:
    branches: [ci/lockfile-and-web-optimization]
    paths: ["web/package.json", ".github/workflows/generate-lockfile.yml"]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/lockfile-and-web-optimization
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --no-progress
      - name: Commit lockfile to feature branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
          else
            git commit -m "chore(web): add npm lockfile"
            git push origin HEAD:ci/lockfile-and-web-optimization
          fi
