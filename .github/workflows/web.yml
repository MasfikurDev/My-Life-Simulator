name: Web validation and Pages deployment
on:
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --no-progress
      - name: Run static checks and tests in parallel
        shell: bash
        run: |
          npm run check &
          check_pid=$!
          npm test &
          test_pid=$!

          check_status=0
          test_status=0
          wait "$check_pid" || check_status=$?
          wait "$test_pid" || test_status=$?

          if [ "$check_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            echo "Validation failed (svelte-check: $check_status, tests: $test_status)."
            exit 1
          fi
      # GitHub Pages is hosted below /<repository>/.
      - name: Build production site
        env:
          VITE_BASE_PATH: /My-Life-Simulator/
        run: npm run build:app
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
