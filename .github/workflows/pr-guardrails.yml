name: Pull request safeguards

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  file-deletion-guard:
    name: Prevent unreviewed file deletions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require explicit approval for deleted files
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ALLOW_FILE_DELETIONS: ${{ contains(github.event.pull_request.labels.*.name, 'allow-file-deletions') }}
        run: bash .github/scripts/check-pr-deletions.sh
