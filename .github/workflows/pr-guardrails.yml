name: Pull request safeguards

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  file-deletion-guard:
    # The edited event is needed for checklist-body changes, not title-only edits.
    if: github.event.action != 'edited' || github.event.changes.body != null
    name: Prevent unreviewed file deletions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR merge and base commits
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require explicit approval for deleted files
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DELETIONS_REVIEWED: ${{ contains(github.event.pull_request.body, '[x] Intentional file deletions reviewed') }}
        run: bash .github/scripts/check-pr-deletions.sh
