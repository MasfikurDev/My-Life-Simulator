name: Clean up merged branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List eligible branches without deleting them
        required: true
        type: boolean
        default: true
      minimum_age_days:
        description: Minimum number of days since the pull request was merged
        required: true
        type: number
        default: 7
  pull_request:
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"
      - ".github/scripts/cleanup-merged-branches.sh"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merged-branch-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate cleanup script syntax
        run: bash -n .github/scripts/cleanup-merged-branches.sh

  cleanup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      MINIMUM_AGE_DAYS: ${{ inputs.minimum_age_days }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clean up eligible merged branches
        run: bash .github/scripts/cleanup-merged-branches.sh
